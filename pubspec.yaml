name: my_list
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  overlay_support: ^2.1.0
  flutter_overlay_window: ^0.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  flutter_colorpicker: ^1.1.0
  file_picker: ^10.3.3
  excel: ^4.0.6
  desktop_drop: ^0.7.0
  string_similarity: ^2.0.0
  file_saver: ^0.2.13
  fl_chart: ^0.68.0
  intl: ^0.19.0
  pdf: ^3.11.3
  printing: ^5.14.3
  media_store_plus: ^0.1.3
  archive: ^3.6.1
  share_intake:
    path: packages/share_intake





dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"

